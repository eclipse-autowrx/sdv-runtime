name: C++ Compilation Service Tests

on:
  push:
    branches: [ tree-structure-clean ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify submodules
      run: |
        echo "Checking submodules..."
        git submodule status
        if [ ! -d "vehicle_signal_specification" ] || [ ! -d "vehicle-model-generator" ]; then
          echo "Submodules not found, initializing..."
          git submodule update --init --recursive
        fi
        ls -la vehicle_signal_specification/ || echo "VSS submodule missing"
        ls -la vehicle-model-generator/ || echo "Vehicle model generator submodule missing"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
        
    - name: Build SDV Runtime Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: |
          sdv-runtime-production:latest
          sdv-runtime-production:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true
          
    - name: Test Docker Image Build
      run: |
        docker images | grep sdv-runtime-production
        echo "Docker image built successfully"
        
    - name: Validate Docker Image
      run: |
        echo "Docker image validation complete"
        docker images | grep sdv-runtime-production
        
    - name: Save Docker Image
      if: success()
      run: |
        docker save sdv-runtime-production:latest | gzip > sdv-runtime-image.tar.gz
        ls -lh sdv-runtime-image.tar.gz
        
    - name: Cleanup
      if: always()
      run: |
        echo "Build completed"